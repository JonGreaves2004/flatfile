<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitions Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  /* ============================================================
     CONFIG — edit these two lines for your own sheet
     ============================================================ */
  :root {
    --fairway: #1B4332;
    --fairway-dark: #12301F;
    --parchment: #F4EFE3;
    --parchment-dark: #E8E0CC;
    --brass: #B08D57;
    --brass-light: #D4B77E;
    --ink: #22221D;
    --ink-soft: #55534A;
    --red: #8B3A3A;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  }

  /* -------- Header: clubhouse noticeboard -------- */
  header.board {
    background: var(--fairway);
    background-image: linear-gradient(180deg, var(--fairway) 0%, var(--fairway-dark) 100%);
    color: var(--parchment);
    padding: 48px 24px 36px;
    text-align: center;
    border-bottom: 6px solid var(--brass);
    position: relative;
  }
  header.board::before {
    content: "";
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 6px;
    background: var(--brass);
    border-radius: 3px;
    opacity: 0.85;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--brass-light);
    margin-bottom: 10px;
  }
  h1.club-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(30px, 5vw, 48px);
    margin: 0 0 8px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 15px;
    color: var(--parchment-dark);
    max-width: 480px;
    margin: 0 auto;
  }

  /* -------- Controls -------- */
  .controls {
    max-width: 880px;
    margin: -24px auto 0;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  .search-slot {
    background: var(--parchment);
    border: 1px solid var(--brass);
    border-radius: var(--radius);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    padding: 4px;
    display: flex;
    align-items: center;
  }
  .search-slot input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }
  .search-slot input::placeholder { color: var(--ink-soft); }
  .search-slot .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--parchment);
    background: var(--fairway);
    padding: 6px 10px;
    border-radius: 2px;
    margin-right: 6px;
    letter-spacing: 1px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 16px auto 0;
    max-width: 880px;
    padding: 0 20px;
  }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 7px 14px;
    border: 1px solid var(--brass);
    border-radius: 20px;
    background: transparent;
    color: var(--fairway-dark);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .chip.active, .chip:hover {
    background: var(--brass);
    color: #fff;
  }

  /* -------- Card list -------- */
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .stub {
    background: #fff;
    border: 1px solid #DFD6BE;
    border-radius: var(--radius);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  .stub-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .stub-head:hover { background: #FAF7EE; }

  .peg {
    flex-shrink: 0;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 0 3px var(--parchment-dark);
  }

  .stub-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    flex: 1;
    min-width: 0;
  }

  .stub-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    background: var(--parchment-dark);
    padding: 4px 9px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .chevron {
    font-size: 13px;
    color: var(--brass);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .stub.open .chevron { transform: rotate(90deg); }

  .stub-body {
    display: none;
    padding: 4px 18px 22px 42px;
    border-top: 1px dashed #DFD6BE;
  }
  .stub.open .stub-body { display: block; }

  .field {
    margin-top: 14px;
  }
  .field:first-child { margin-top: 16px; }
  .field-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 4px;
  }
  .field-value {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .empty, .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  footer {
    text-align: center;
    padding: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header class="board">
  <div class="eyebrow">Competitions Committee</div>
  <h1 class="club-title">Competitions Archive</h1>
  <p class="subtitle">Rules, prizes and history for every club competition — pulled straight from the committee's records.</p>
  <div id="admin-badge" style="display:none; margin-top:14px; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:1.5px; color:#22221D; background:var(--brass-light); display:inline-block; padding:5px 12px; border-radius:12px;">ADMIN VIEW — booking &amp; scheduling fields shown</div>
</header>

<div class="controls">
  <div class="search-slot">
    <span class="tag">FIND</span>
    <input id="search" type="text" placeholder="Search by name, rule, prize…">
  </div>
</div>
<div class="chips" id="chips"></div>

<main id="list">
  <div class="loading">Fetching the register…</div>
</main>

<footer>Data source: club committee spreadsheet</footer>

<script>
/* ============================================================
   CONFIG — edit these for your own sheet
   ============================================================ */
const SHEET_ID = "1DJnE1DxBjoyry2YEpI51tps51rth-ue3L7BRKaFfP4w";
const GID = "0";

/* Fields hidden from the normal member-facing view.
   Add ?admin to the URL to reveal these too.
   Edit this list to match which of YOUR columns are
   internal booking/admin config vs member-facing info. */
const ADMIN_FIELDS = new Set([
  "Course Cards", "Start Sheet", "1st & last tee times", "Players per time",
  "Interval (10 Mins)", "Enable booking options", "Enabled from and to",
  "Zones for drawn comps", "Enable Sign in", "Sign in options",
  "From and to times", "Sign In Message", "Enable Charges",
  "When to charge", "Refund options", "Score entry"
]);
const IS_ADMIN_VIEW = new URLSearchParams(window.location.search).has("admin");

/* Columns that look like they hold a short category/type value
   get turned into filter chips automatically. Add your own
   exact header name here if auto-detection picks the wrong one,
   e.g. CATEGORY_HEADER_OVERRIDE = "Format"; */
const CATEGORY_HEADER_OVERRIDE = "Comp format (scoring type)";
const CATEGORY_HEADER_GUESSES = /^(type|category|format|comp type|competition type)$/i;

/* The column used as the card title. Override if auto-detection
   picks the wrong one, e.g. TITLE_HEADER_OVERRIDE = "Competition"; */
const TITLE_HEADER_OVERRIDE = "Comp name";
const TITLE_HEADER_GUESSES = /^(name|comp|competition|competition name|title)$/i;

let ROWS = [];
let HEADERS = [];
let CATEGORY_HEADER = null;
let TITLE_HEADER = null;
let ACTIVE_CHIP = null;

function pickHeader(guessRegex, override) {
  if (override) return override;
  return HEADERS.find(h => guessRegex.test(h.trim())) || null;
}

function isShortCategoryColumn(header) {
  const values = ROWS.map(r => (r[header] || "").trim()).filter(Boolean);
  if (!values.length) return false;
  const unique = new Set(values);
  const avgLen = values.reduce((a, v) => a + v.length, 0) / values.length;
  return unique.size > 1 && unique.size <= 8 && avgLen <= 22;
}

function render() {
  const list = document.getElementById("list");
  const query = document.getElementById("search").value.trim().toLowerCase();

  let rows = ROWS;
  if (ACTIVE_CHIP && CATEGORY_HEADER) {
    rows = rows.filter(r => (r[CATEGORY_HEADER] || "").trim() === ACTIVE_CHIP);
  }
  if (query) {
    rows = rows.filter(r =>
      HEADERS.some(h => (r[h] || "").toLowerCase().includes(query))
    );
  }

  if (!rows.length) {
    list.innerHTML = `<div class="empty">No competitions match that search.</div>`;
    return;
  }

  list.innerHTML = rows.map((r, i) => {
    const title = TITLE_HEADER ? (r[TITLE_HEADER] || "Untitled competition") : (r[HEADERS[0]] || "Untitled competition");
    const metaVal = CATEGORY_HEADER ? (r[CATEGORY_HEADER] || "") : "";
    const otherFields = HEADERS.filter(h => h !== TITLE_HEADER && (IS_ADMIN_VIEW || !ADMIN_FIELDS.has(h)));

    const fieldsHtml = otherFields.map(h => {
      const val = (r[h] || "").trim();
      if (!val) return "";
      return `
        <div class="field">
          <div class="field-label">${escapeHtml(h)}</div>
          <div class="field-value">${escapeHtml(val)}</div>
        </div>`;
    }).join("");

    return `
      <div class="stub" data-idx="${i}">
        <div class="stub-head" onclick="toggle(${i})">
          <span class="peg"></span>
          <span class="stub-title">${escapeHtml(title)}</span>
          ${metaVal ? `<span class="stub-meta">${escapeHtml(metaVal)}</span>` : ""}
          <span class="chevron">&#9656;</span>
        </div>
        <div class="stub-body">${fieldsHtml}</div>
      </div>`;
  }).join("");
}

function toggle(idx) {
  const el = document.querySelector(`.stub[data-idx="${idx}"]`);
  if (el) el.classList.toggle("open");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildChips() {
  const chipsEl = document.getElementById("chips");
  if (!CATEGORY_HEADER) { chipsEl.style.display = "none"; return; }
  const values = [...new Set(ROWS.map(r => (r[CATEGORY_HEADER] || "").trim()).filter(Boolean))].sort();
  if (values.length < 2) { chipsEl.style.display = "none"; return; }

  chipsEl.innerHTML = `<button class="chip active" data-val="">All</button>` +
    values.map(v => `<button class="chip" data-val="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join("");

  chipsEl.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      chipsEl.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      ACTIVE_CHIP = btn.dataset.val || null;
      render();
    });
  });
}

google.charts.load('current');
google.charts.setOnLoadCallback(loadRegister);

function loadRegister() {
  const query = new google.visualization.Query(
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}`
  );
  query.send(handleQueryResponse);
}

function handleQueryResponse(response) {
  if (response.isError()) {
    document.getElementById("list").innerHTML =
      `<div class="empty">Couldn't load the register. Check the sheet is shared as "Anyone with the link can view", and that SHEET_ID / GID in the code are correct.<br><br>(${escapeHtml(response.getMessage())})</div>`;
    return;
  }

  const dataTable = response.getDataTable();
  const numCols = dataTable.getNumberOfColumns();
  const rawHeaders = [];
  for (let c = 0; c < numCols; c++) rawHeaders.push((dataTable.getColumnLabel(c) || "").trim());

  HEADERS = [...new Set(rawHeaders.filter(h => h.length > 0))];

  ROWS = [];
  for (let r = 0; r < dataTable.getNumberOfRows(); r++) {
    const row = {};
    for (let c = 0; c < numCols; c++) {
      const h = rawHeaders[c];
      if (!h) continue;
      row[h] = (dataTable.getFormattedValue(r, c) || "").trim();
    }
    ROWS.push(row);
  }

  TITLE_HEADER = pickHeader(TITLE_HEADER_GUESSES, TITLE_HEADER_OVERRIDE) || HEADERS[0];
  CATEGORY_HEADER = pickHeader(CATEGORY_HEADER_GUESSES, CATEGORY_HEADER_OVERRIDE)
    || HEADERS.find(h => h !== TITLE_HEADER && isShortCategoryColumn(h))
    || null;

  buildChips();
  render();
}

document.getElementById("search").addEventListener("input", render);
if (IS_ADMIN_VIEW) {
  document.getElementById("admin-badge").style.display = "inline-block";
}
</script>

</body>
</html>
